name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "mobile-warga/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile-warga/**"
      - ".github/workflows/mobile-ci.yml"

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-warga
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install mobile dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
